  # ── Supply chain (SEC-50, SEC-53) ────────────────────────────────────────

  sbom:
    name: SBOM + build provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer sbom
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      # @cyclonedx/cyclonedx-npm doesn't read bun.lock directly (verified) —
      # it needs a real npm-format lockfile. package-lock.json here is a
      # throwaway snapshot for SBOM purposes only, never committed (bun.lock
      # stays authoritative for installs).
      - run: npm install --package-lock-only --ignore-scripts
      # npx, not bunx: cyclonedx-npm does its own npm-version detection
      # (requires >= 9.0.0) via the invoking package manager's own env vars
      # — bunx sets those to point at bun itself, which cyclonedx-npm can't
      # parse as an npm version, failing with "Unsupported NPM version.
      # Expected >= 9.0.0, got <bun's own version>". Real npm is already
      # set up on PATH via actions/setup-node above, so npx is a correct,
      # no-new-dependency fix, not a workaround.
      - run: npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom-npm.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom-composer.cdx.json
            sbom-npm.cdx.json
          retention-days: 90
      # SEC-53: SLSA build provenance binding these SBOM artifacts to the
      # commit/builder/inputs that produced them.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            sbom-composer.cdx.json
            sbom-npm.cdx.json

  # ── Deployment: SEC-01 deny-rule verification ────────────────────────────
  # Additive to, not a replacement for, the php -S-based suites above — the
  # only thing these two jobs test is that the shipped .htaccess/Caddyfile
  # deny rules actually work on every server this project ships, which
  # `php -S` can't exercise at all (it has no .htaccess support and isn't
  # the container image). nginx isn't tested here — it's docs-only
  # (docs/REFERENCE.md), since this project doesn't ship an nginx image.

  apache-deny-rules:
    name: Apache .htaccess deny rules + web-root isolation (SEC-01, SEC-33/35/38/47)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Apache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apache2
          sudo a2enmod rewrite
          # /home/runner/work is owned by the `runner` user and isn't
          # traversable by www-data (the default APACHE_RUN_USER), so the
          # OS denies every request under this checkout before Apache's
          # own <Directory>/.htaccess logic ever runs. An explicit
          # <Directory> grant can't fix this -- Apache's authorization
          # phase is never reached. This throwaway CI-only Apache instead
          # runs as the `runner` user, which already owns the whole
          # checkout.
          sudo sed -i \
            -e 's/^export APACHE_RUN_USER=.*/export APACHE_RUN_USER=runner/' \
            -e 's/^export APACHE_RUN_GROUP=.*/export APACHE_RUN_GROUP=runner/' \
            /etc/apache2/envvars
      - name: Create representative permission-gated fixture files
        run: |
          # upload/, _data/i, _data/logs are .gitignore'd runtime data, absent
          # from a bare checkout -- created here as real files so the
          # assertions below prove an existing, readable-on-disk file is
          # still unreachable over HTTP, not just "this path happens not to
          # exist". galleries/language/plugins/local/ already ship a real
          # tracked index.php each, reused as-is.
          mkdir -p upload/2026/01/01 _data/i _data/logs
          echo fixture > upload/2026/01/01/photo.jpg
          echo fixture > _data/i/derivative-th.jpg
          echo fixture > _data/logs/piwigo.log
      - name: Serve the checkout's public/ with the shipped .htaccess
        run: |
          cat <<VHOSTEOF | sudo tee /etc/apache2/sites-available/000-default.conf
          <VirtualHost *:80>
              DocumentRoot ${{ github.workspace }}/public
              <Directory ${{ github.workspace }}/public>
                  Options FollowSymLinks
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>
          VHOSTEOF
          sudo systemctl restart apache2
          until curl -s -o /dev/null http://localhost/; do sleep 0.5; done
      - name: Assert SEC-01-listed paths are still denied (unchanged by the move)
        run: |
          # mod_rewrite's RewriteCond %{REQUEST_URI} match fires against
          # the literal request URI text at the DocumentRoot's own
          # public/.htaccess, independent of whether the matched path
          # segment corresponds to a real file/directory under
          # DocumentRoot -- so these paths return 403, not 404. Re-asserted
          # here as a regression guard on the rule itself.
          for path in tools/index.php install/config.sql tests/Fixtures/piwigo-17.0.sql \
              vendor/autoload.php node_modules/.bin/vite docs/PLAN.md deploy/helm/piwigo/values.yaml \
              composer.json composer.lock package.json bun.lock phpstan.neon psalm.xml rector.php ecs.php \
              knip.json lefthook.yml tsconfig.json .stylelintrc.json .prettierrc.json .markdownlint-cli2.jsonc \
              lighthouserc.json .size-limit.json \
              renovate.json release-please-config.json .release-please-manifest.json eslint-suppressions.json \
              .editorconfig .gitignore .dockerignore Dockerfile docker-compose.yml justfile .env.example \
              vite.config.ts; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "403" ]; then
              echo "::error::expected 403 for /${path}, got ${status}"
              exit 1
            fi
          done
      - name: Assert vendor/ nested under themes/ stays reachable (SEC-01 gap-closure)
        run: |
          # The SEC-01 vendor/ deny rule is anchored so it doesn't match
          # /vendor/ anywhere in the path -- this asserts a legitimate
          # nested vendor/ under themes/ (themes/default/vendor/fontello/,
          # the theme's own bundled icon font) isn't swept up by the same
          # rule the top-level vendor/autoload.php check above exercises.
          # A permanent regression guard against that class of
          # over-broad-regex bug.
          for path in themes/default/vendor/fontello/css/gallery-icon.css \
              themes/default/vendor/fontello/font/gallery-icon.woff2; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "200" ]; then
              echo "::error::expected 200 for /${path} (theme-bundled asset, not Composer vendor/), got ${status}"
              exit 1
            fi
          done
      # The "Install Apache" step's APACHE_RUN_USER=runner fix above
      # addresses the real cause (AH00035, an OS-level permission wall,
      # not the .htaccess rule or any Directory/Require config). Kept as
      # a standing on-failure diagnostic for this job, matching the
      # "Container logs" pattern below in container-deny-rules.
      - name: Debug Apache state on failure
        if: failure()
        run: |
          echo "::group::AppArmor kernel module + status"
          cat /sys/module/apparmor/parameters/enabled 2>&1 || echo "no apparmor parameters file"
          sudo aa-status 2>&1 || echo "aa-status unavailable"
          echo "::endgroup::"
          echo "::group::Kernel AppArmor denial messages"
          sudo dmesg 2>&1 | grep -i apparmor || echo "no apparmor lines in dmesg"
          sudo journalctl -k --no-pager 2>&1 | grep -i apparmor || echo "no apparmor lines in journalctl -k"
          echo "::endgroup::"
          echo "::group::Apache error log"
          sudo tail -n 150 /var/log/apache2/error.log
          echo "::endgroup::"
          echo "::group::namei on the real resolved path"
          namei -l "${{ github.workspace }}/public/themes/default/vendor/fontello/css/gallery-icon.css"
          echo "::endgroup::"
          echo "::group::verbose curl"
          curl -v http://localhost/themes/default/vendor/fontello/css/gallery-icon.css 2>&1
          echo "::endgroup::"
      - name: Assert permission-gated content is now structurally unreachable (SEC-33/35/38/47)
        run: |
          # Unlike the SEC-01 list above, none of these paths ever match a
          # deny rule -- they're simply outside DocumentRoot (public/), so
          # a direct request 404s like any nonexistent URL instead of
          # serving the file off disk and bypassing i.php's/action.php's
          # own permission checks.
          for path in upload/2026/01/01/photo.jpg galleries/index.php local/index.php \
              language/index.php plugins/index.php \
              _data/i/derivative-th.jpg _data/logs/piwigo.log; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "404" ]; then
              echo "::error::expected 404 (outside public/) for /${path}, got ${status}"
              exit 1
            fi
          done
      - name: Assert health/ready rewrite and the symlinked asset dirs still resolve
        run: |
          # No mod_php in this job (deny-rule verification doesn't need real
          # PHP execution — the [F] rewrite fires before any handler runs);
          # real /health, /ready execution is covered by the container job
          # below and the php -S-based suites above. Just confirm the rewrite
          # target isn't itself swept up by the /(config|tools|...)/deny match,
          # and that public/'s 3 symlinks (themes/, dist/, _data/combined/)
          # still resolve through DocumentRoot -- FollowSymLinks is
          # required (and set) in the vhost above.
          for path in health ready; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" = "403" ] || [ "${status}" = "404" ]; then
              echo "::error::${path} unexpectedly unreachable (got ${status})"
              exit 1
            fi
          done

  container-deny-rules:
    name: Container deny rules (SEC-01)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: docker build --target production -t piwigo:ci .
      - name: Run the container
        run: docker run -d --name piwigo-ci -p 8080:80 piwigo:ci
      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::container did not become healthy in time"
          docker logs piwigo-ci
          exit 1
      - name: Assert sensitive paths are denied
        run: |
          for path in tools/index.php install/config.sql config/anything \
              vendor/autoload.php deploy/helm/piwigo/values.yaml \
              composer.json composer.lock package.json bun.lock phpstan.neon psalm.xml rector.php ecs.php \
              knip.json lefthook.yml tsconfig.json .stylelintrc.json .prettierrc.json .markdownlint-cli2.jsonc \
              lighthouserc.json .size-limit.json \
              renovate.json release-please-config.json .release-please-manifest.json eslint-suppressions.json \
              .editorconfig .gitignore .dockerignore Dockerfile docker-compose.yml justfile .env.example \
              vite.config.ts; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "403" ]; then
              echo "::error::expected 403 for /${path}, got ${status}"
              exit 1
            fi
          done
      - name: Assert permission-gated content is structurally unreachable (SEC-33/35/38/47)
        run: |
          # Caddyfile's root is /app/public -- unlike the @denied/
          # @denied_files matchers above (URL-pattern rules, unaffected by
          # the root) which still fire the same way, these paths have no
          # matching deny rule of their own. Without one, php_server's
          # default try_files (`{path} {path}/index.php index.php`) would
          # silently route any non-static path to index.php instead,
          # returning 200 -- the @deniedRelocated/@deniedData matchers
          # close that gap with an explicit 403, same as the
          # @denied/@denied_files paths.
          # The Dockerfile's production stage already mkdir's _data/local/
          # galleries/upload empty and chowns them to www-data -- write a
          # real file into the running container so this proves an
          # existing, readable file is unreachable, not just a missing path.
          docker exec piwigo-ci sh -c "mkdir -p /app/upload/2026/01/01 /app/_data/i /app/_data/logs && \
              echo fixture > /app/upload/2026/01/01/photo.jpg && \
              echo fixture > /app/_data/i/derivative-th.jpg && \
              echo fixture > /app/_data/logs/piwigo.log"
          for path in upload/2026/01/01/photo.jpg galleries/index.php local/index.php \
              language/index.php plugins/index.php \
              _data/i/derivative-th.jpg _data/logs/piwigo.log; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "403" ]; then
              echo "::error::expected 403 (denied by @deniedRelocated/@deniedData) for /${path}, got ${status}"
              exit 1
            fi
          done
      - name: Container logs
        if: failure()
        run: docker logs piwigo-ci
