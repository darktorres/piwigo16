name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  style:
    name: PSR-12 (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/pint --test
