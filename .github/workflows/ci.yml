name: CI

on:
  push:
    branches: ["17.x-rewrite"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: ["17.x-rewrite"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

# Cancel superseded PR runs so rapid pushes don't pile up; never cancel a
# push run on 17.x-rewrite itself, since that would silently drop that
# commit's own SBOM/attestation output for no benefit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_EXTENSIONS: calendar,ctype,curl,dom,fileinfo,filter,gd,iconv,intl,libxml,mbstring,mysqli,openssl,session,simplexml,zlib

jobs:
  # ── PHP: lint / static analysis ─────────────────────────────────────────

  pest:
    name: Pest (unit + arch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test

  ecs:
    name: ECS (style, non-blocking until P5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # ECS checks whole files, not diffs, so pre-existing legacy violations
      # would block unrelated commits — not a real gate until P5 applies --fix
      # (see docs/PLAN.md P0 step 4 and lefthook.yml's matching `|| true`).
      - run: composer lint:php
        continue-on-error: true

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # PHPStan's default resultCache/analysis cache lives under
      # sys_get_temp_dir()/phpstan (verified empirically: resultCache.php +
      # a much larger per-file cache/PHPStan/ tree) — no phpstan.neon
      # tmpDir override needed, just persist the runner's own default.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-
      - run: vendor/bin/phpstan analyse --no-progress

  # Psalm is not gated in CI (see docs/REFERENCE.md's ADR-0026) —
  # its global-function-resolution scanner doesn't hold up at this
  # codebase's current scale/style (non-namespaced procedural legacy
  # code); resumes once P6+ typed/namespaced refactoring lands.

  rector:
    name: Rector (dry-run, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Not applied until P5 — see docs/PLAN.md's Rector strategy.
      - run: vendor/bin/rector --dry-run
        continue-on-error: true

  coverage:
    name: Code coverage (pcov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: pcov
          extensions: ${{ env.PHP_EXTENSIONS }},pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # 0.1 is a ratchet floor just under the measured 0.2% Unit+Arch baseline
      # (~500 legacy files are un-namespaced and untouched by these suites) —
      # expected to climb sharply from P5 onward.
      - run: composer test:coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # No --abandoned=fail: phpbench/phpbench (dev-only benchmarking tool,
      # never shipped) requires doctrine/annotations ^2.0, which Composer
      # flags abandoned with no replacement. Still reported in the log below,
      # just not escalated to a failure for a transitive dev-only dependency
      # we don't control.
      - run: composer audit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # @lhci/cli@0.15.1 (latest, dev-only Lighthouse CLI, never shipped) pins
      # vulnerable tmp/uuid ranges with no fixed release available upstream —
      # re-check these on every Renovate bump of @lhci/cli.
      - run: |
          bun audit \
            --ignore=GHSA-52f5-9888-hmc6 \
            --ignore=GHSA-ph9p-34f9-6g65 \
            --ignore=GHSA-w5hq-g745-h8pq

  deptrac:
    name: Deptrac (from P6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/deptrac analyse --no-progress

  require-checker:
    name: composer-require-checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer require-checker

  composer-unused:
    name: composer-unused
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer unused

  phpbench:
    name: PHPBench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Runs cleanly with 0 subjects until P12 adds tests/Bench/*.php.
      - run: vendor/bin/phpbench run --report=aggregate | tee phpbench-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpbench-report
          path: phpbench-report.txt
          retention-days: 30

  # ── JS/TS/CSS ────────────────────────────────────────────────────────────

  vitest:
    name: Vitest (TS unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test

  eslint:
    name: ESLint (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint:js

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint:css

  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run knip

  size-limit:
    name: size-limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run size-limit

  k6-load:
    name: k6 load (from P32)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # tests/Load/*.js doesn't exist until P32 — non-blocking (warning) per
      # docs/PLAN.md, no-op until then.
      - if: hashFiles('tests/Load/**') != ''
        run: echo "k6 load surface not present yet (P32)"

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: bunx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
      - if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: bunx commitlint --from ${{ github.sha }}~1 --to ${{ github.sha }} --verbose

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error

  test-file-inventory:
    name: Test file inventory (P0 "just test" lesson)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Every wired-up testsuite directory must contain at least one real
      # *Test.php file. Catches the exact failure the 16.x-v2 lesson describes:
      # a testsuite silently running 0 tests (Pest exits 0 on a --filter that
      # matches nothing inside a non-empty suite, so file presence is the only
      # reliable signal). tests/Integration/ hit exactly this until this phase
      # added DatabaseConnectionTest.php.
      - run: |
          set -euo pipefail
          for dir in Unit Arch Integration Contract Browser; do
            count=$(find "tests/$dir" -maxdepth 1 -name '*Test.php' | wc -l)
            echo "tests/$dir: $count Test.php file(s)"
            if [ "$count" -eq 0 ]; then
              echo "::error::tests/$dir has no *Test.php files — its testsuite would silently run 0 tests"
              exit 1
            fi
          done

  # ── DB-backed suites ─────────────────────────────────────────────────────

  integration:
    name: Pest (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piwigo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Provision piwigo_test from the committed fixture
        run: |
          mysql -h127.0.0.1 -uroot -proot piwigo_test < tests/Fixtures/piwigo-17.0.sql
          until mysql -h127.0.0.1 -uroot -proot piwigo_test -e 'SELECT COUNT(*) FROM piwigo_images;' > /dev/null 2>&1; do sleep 0.5; done
      - name: Write .env.test
        run: |
          cat > .env.test <<'ENVEOF'
          PIWIGO_DB_HOST=127.0.0.1
          PIWIGO_DB_PORT=3306
          PIWIGO_DB_USER=root
          PIWIGO_DB_PASSWORD=root
          PIWIGO_DB_BASE=piwigo_test
          PIWIGO_DB_PREFIX=piwigo_
          PIWIGO_BASE_URL=http://localhost:8080
          ENVEOF
      - run: mkdir -p local && touch local/.installed.test
      - run: composer test:integration

  contract:
    name: Pest (WS contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piwigo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Provision piwigo_test from the committed fixture
        run: |
          mysql -h127.0.0.1 -uroot -proot piwigo_test < tests/Fixtures/piwigo-17.0.sql
          until mysql -h127.0.0.1 -uroot -proot piwigo_test -e 'SELECT COUNT(*) FROM piwigo_images;' > /dev/null 2>&1; do sleep 0.5; done
      - name: Write .env.test
        run: |
          cat > .env.test <<'ENVEOF'
          PIWIGO_DB_HOST=127.0.0.1
          PIWIGO_DB_PORT=3306
          PIWIGO_DB_USER=root
          PIWIGO_DB_PASSWORD=root
          PIWIGO_DB_BASE=piwigo_test
          PIWIGO_DB_PREFIX=piwigo_
          PIWIGO_BASE_URL=http://localhost:8080
          ENVEOF
      - run: mkdir -p local && touch local/.installed.test
      - name: Start PHP built-in server
        run: |
          php -S localhost:8080 -t public > /tmp/php-server.log 2>&1 &
          until curl -sf http://localhost:8080/index.php > /dev/null; do sleep 0.5; done
      - run: composer test:contract

  browser:
    name: Pest (browser E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piwigo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Playwright + Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium system deps only (browser binary cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Provision piwigo_test from the committed fixture
        run: |
          mysql -h127.0.0.1 -uroot -proot piwigo_test < tests/Fixtures/piwigo-17.0.sql
          until mysql -h127.0.0.1 -uroot -proot piwigo_test -e 'SELECT COUNT(*) FROM piwigo_images;' > /dev/null 2>&1; do sleep 0.5; done
      - name: Write .env.test
        run: |
          cat > .env.test <<'ENVEOF'
          PIWIGO_DB_HOST=127.0.0.1
          PIWIGO_DB_PORT=3306
          PIWIGO_DB_USER=root
          PIWIGO_DB_PASSWORD=root
          PIWIGO_DB_BASE=piwigo_test
          PIWIGO_DB_PREFIX=piwigo_
          PIWIGO_BASE_URL=http://localhost:8080
          ENVEOF
      - run: mkdir -p local && touch local/.installed.test
      - name: Start PHP built-in server
        run: |
          php -S localhost:8080 -t public > /tmp/php-server.log 2>&1 &
          until curl -sf http://localhost:8080/index.php > /dev/null; do sleep 0.5; done
      - run: composer test:browser

  install-flow:
    name: Pest (install flow E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piwigo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Playwright + Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium system deps only (browser binary cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Write .env.test
        run: |
          cat > .env.test <<'ENVEOF'
          PIWIGO_DB_HOST=127.0.0.1
          PIWIGO_DB_PORT=3306
          PIWIGO_DB_USER=root
          PIWIGO_DB_PASSWORD=root
          PIWIGO_DB_BASE=piwigo_test
          PIWIGO_DB_PREFIX=piwigo_
          PIWIGO_BASE_URL=http://localhost:8080
          ENVEOF
      # docs/PLAN.md gap-closure, 2026-07-23: deliberately
      # skips the 2 steps every other Browser-suite job above has --
      # "Provision piwigo_test from the committed fixture" and `touch
      # local/.installed.test` -- both exist specifically so the *other*
      # ~70 tests (which assume an already-installed, fixture-loaded app)
      # work. This job's mysql service starts with an empty piwigo_test
      # database by construction (MYSQL_DATABASE above), and no
      # .installed.test marker means InstallTest.php's own
      # markTestSkipped() guard is never reached -- this is the whole
      # point: give the install flow a real, executed run instead of a
      # permanent, silent skip.
      - name: Start PHP built-in server
        run: |
          # docs/PLAN.md gap-closure, 2026-07-23: -t public, not
          # -t . -- verified directly (a real `php -S -t .` + `curl
          # /index.php` locally) that `-t .` 404s immediately at the PHP dev
          # server's own routing layer, before any application code runs,
          # since index.php/health.php/etc. only exist under public/, not
          # the repo root. This job's own health-check would spin until
          # timeout-minutes with -t . -- the other Browser-suite jobs above
          # carried the same bug (each burning its own full timeout every
          # run) until it was propagated to them too; this job's own
          # /health.php choice (see below) is unrelated to that fix and
          # stays deliberate for this job's own reasons.
          php -S localhost:8080 -t public > /tmp/php-server.log 2>&1 &
          # health.php (not the clean /health URL -- that needs
          # .htaccess's RewriteRule, which php -S doesn't process) is
          # liveness-only: no DB, no Piwigo bootstrap, see
          # public/health.php. Deliberately not /index.php, which
          # depends on Piwigo's own install-state detection and has no
          # reason to be exercised twice by two different probes.
          until curl -sf http://localhost:8080/health.php > /dev/null; do sleep 0.5; done
      - run: composer test:install

