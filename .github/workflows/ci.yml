  # ── Supply chain (SEC-50, SEC-53) ────────────────────────────────────────

  sbom:
    name: SBOM + build provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer sbom
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      # @cyclonedx/cyclonedx-npm doesn't read bun.lock directly (verified) —
      # it needs a real npm-format lockfile. package-lock.json here is a
      # throwaway snapshot for SBOM purposes only, never committed (bun.lock
      # stays authoritative for installs).
      - run: npm install --package-lock-only --ignore-scripts
      - run: bunx cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom-npm.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom-composer.cdx.json
            sbom-npm.cdx.json
          retention-days: 90
      # SEC-53: SLSA build provenance binding these SBOM artifacts to the
      # commit/builder/inputs that produced them.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            sbom-composer.cdx.json
            sbom-npm.cdx.json

  # ── Deployment: SEC-01 deny-rule verification (P4) ───────────────────────
  # Additive to, not a replacement for, the php -S-based suites above — the
  # only thing these two jobs test is that the shipped .htaccess/Caddyfile
  # deny rules actually work on every server this project ships, which
  # `php -S` can't exercise at all (it has no .htaccess support and isn't
  # the container image). nginx isn't tested here — it's docs-only
  # (docs/DEPLOYMENT.md), since this project doesn't ship an nginx image.

  apache-deny-rules:
    name: Apache .htaccess deny rules + web-root isolation (SEC-01, SEC-33/35/38/47)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Apache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apache2
          sudo a2enmod rewrite
      # Part II (web-root isolation): upload/, _data/i, _data/logs are
      # .gitignore'd runtime data, absent from a bare checkout -- created
      # here as real files so the new assertions below prove an existing,
      # readable-on-disk file is still unreachable over HTTP, not just
      # "this path happens not to exist". galleries/language/plugins/local/
      # already ship a real tracked index.php each, reused as-is.
      - name: Create representative permission-gated fixture files
        run: |
          mkdir -p upload/2026/01/01 _data/i _data/logs
          echo fixture > upload/2026/01/01/photo.jpg
          echo fixture > _data/i/derivative-th.jpg
          echo fixture > _data/logs/piwigo.log
      - name: Serve the checkout's public/ with the shipped .htaccess
        run: |
          cat <<VHOSTEOF | sudo tee /etc/apache2/sites-available/000-default.conf
          <VirtualHost *:80>
              DocumentRoot ${{ github.workspace }}/public
              <Directory ${{ github.workspace }}/public>
                  Options FollowSymLinks
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>
          VHOSTEOF
          sudo systemctl restart apache2
          until curl -s -o /dev/null http://localhost/; do sleep 0.5; done
      - name: Assert SEC-01-listed paths are still denied (unchanged by the move)
        run: |
          # Verified empirically (a throwaway isolated Apache instance, not
          # assumed): mod_rewrite's RewriteCond %{REQUEST_URI} match fires
          # against the literal request URI text at the DocumentRoot's own
          # .htaccess (now public/.htaccess), independent of whether the
          # matched path segment corresponds to a real file/directory under
          # the new, smaller DocumentRoot -- so these paths were already
          # 403 before Part II and stay exactly 403 after it, not 404. The
          # move doesn't change anything for this category; it's re-asserted
          # here only as a regression guard on the rule itself.
          for path in tools/index.php install/config.sql tests/Fixtures/piwigo-17.0.sql \
              vendor/autoload.php node_modules/.bin/vite docs/PLAN-REPLAY.md deploy/helm/piwigo/values.yaml \
              composer.json composer.lock package.json bun.lock phpstan.neon psalm.xml rector.php ecs.php \
              knip.json lefthook.yml tsconfig.json .stylelintrc.json .prettierrc.json lighthouserc.json .size-limit.json \
              renovate.json release-please-config.json .release-please-manifest.json eslint-suppressions.json \
              .editorconfig .gitignore .dockerignore Dockerfile docker-compose.yml justfile .env.example \
              vite.config.ts; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "403" ]; then
              echo "::error::expected 403 for /${path}, got ${status}"
              exit 1
            fi
          done
      - name: Assert permission-gated content is now structurally unreachable (SEC-33/35/38/47)
        run: |
          # The real Part II fix, previously untested: unlike the SEC-01
          # list above, none of these paths ever matched a deny rule --
          # before Part II they were served directly off disk (DocumentRoot
          # was the repo root), bypassing i.php's/action.php's own
          # permission checks entirely for anyone who knew/guessed the URL.
          # Now they're simply outside DocumentRoot (public/), so they 404
          # like any nonexistent URL -- confirmed a real, on-disk file at
          # each of these paths still gets a plain 404, not a deny-rule 403
          # (there is no rule that would produce one).
          for path in upload/2026/01/01/photo.jpg galleries/index.php local/index.php \
              language/index.php plugins/index.php \
              _data/i/derivative-th.jpg _data/logs/piwigo.log; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "404" ]; then
              echo "::error::expected 404 (outside public/) for /${path}, got ${status}"
              exit 1
            fi
          done
      - name: Assert health/ready rewrite and the symlinked asset dirs still resolve
        run: |
          # No mod_php in this job (deny-rule verification doesn't need real
          # PHP execution — the [F] rewrite fires before any handler runs);
          # real /health, /ready execution is covered by the container job
          # below and the php -S-based suites above. Just confirm the rewrite
          # target isn't itself swept up by the /(config|tools|...)/deny match,
          # and that public/'s 4 symlinks (themes/, admin/themes/, dist/,
          # _data/combined/) still resolve through the new DocumentRoot --
          # FollowSymLinks is required (and set) in the vhost above.
          for path in health ready; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" = "403" ] || [ "${status}" = "404" ]; then
              echo "::error::${path} unexpectedly unreachable (got ${status})"
              exit 1
            fi
          done

  container-deny-rules:
    name: Container deny rules (SEC-01)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build the production image
        run: docker build --target production -t piwigo:ci .
      - name: Run the container
        run: docker run -d --name piwigo-ci -p 8080:80 piwigo:ci
      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::container did not become healthy in time"
          docker logs piwigo-ci
          exit 1
      - name: Assert sensitive paths are denied
        run: |
          for path in tools/index.php install/config.sql config/anything \
              vendor/autoload.php deploy/helm/piwigo/values.yaml \
              composer.json composer.lock package.json bun.lock phpstan.neon psalm.xml rector.php ecs.php \
              knip.json lefthook.yml tsconfig.json .stylelintrc.json .prettierrc.json lighthouserc.json .size-limit.json \
              renovate.json release-please-config.json .release-please-manifest.json eslint-suppressions.json \
              .editorconfig .gitignore .dockerignore Dockerfile docker-compose.yml justfile .env.example \
              vite.config.ts; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "403" ]; then
              echo "::error::expected 403 for /${path}, got ${status}"
              exit 1
            fi
          done
      - name: Assert permission-gated content is structurally unreachable (SEC-33/35/38/47)
        run: |
          # Part II: Caddyfile's root is now /app/public, not /app -- unlike
          # the @denied/@denied_files matchers above (URL-pattern rules,
          # unaffected by the root change, still fire the same way), these
          # paths never had a matching rule at all. Before Part II they were
          # served straight off disk; now they're outside root and 404. The
          # Dockerfile's production stage already mkdir's _data/local/
          # galleries/upload empty and chowns them to www-data -- write a
          # real file into the running container so this proves an
          # existing, readable file is unreachable, not just a missing path.
          docker exec piwigo-ci sh -c "mkdir -p /app/upload/2026/01/01 /app/_data/i /app/_data/logs && \
              echo fixture > /app/upload/2026/01/01/photo.jpg && \
              echo fixture > /app/_data/i/derivative-th.jpg && \
              echo fixture > /app/_data/logs/piwigo.log"
          for path in upload/2026/01/01/photo.jpg galleries/index.php local/index.php \
              language/index.php plugins/index.php \
              _data/i/derivative-th.jpg _data/logs/piwigo.log; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/${path}")
            echo "GET /${path} -> ${status}"
            if [ "${status}" != "404" ]; then
              echo "::error::expected 404 (outside /app/public) for /${path}, got ${status}"
              exit 1
            fi
          done
      - name: Container logs
        if: failure()
        run: docker logs piwigo-ci
