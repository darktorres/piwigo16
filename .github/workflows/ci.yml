name: CI

on:
  push:
    branches: ["17.x-rewrite"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: ["17.x-rewrite"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

# Cancel superseded PR runs so rapid pushes don't pile up; never cancel a
# push run on 17.x-rewrite itself, since that would silently drop that
# commit's own SBOM/attestation output for no benefit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_EXTENSIONS: calendar,ctype,curl,dom,fileinfo,filter,gd,iconv,intl,libxml,mbstring,mysqli,openssl,session,simplexml,zlib

jobs:
  # ── PHP: lint / static analysis ─────────────────────────────────────────

  pest:
    name: Pest (unit + arch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test

  ecs:
    name: ECS (style)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # ECS's changed-files cache lives under
      # sys_get_temp_dir()/changed_files_detector_<ecs-version> (the version
      # suffix and the per-cwd namespace both come from ECS's own bundled
      # config/config.php, which calls withCache() before ecs.php is read) —
      # no ecs.php override needed, just persist the runner's own default,
      # same as the phpstan job above. Measured 130s cold vs 1.5s warm.
      #
      # Safe to cache even though this job blocks: ECS hashes the registered
      # checkers *and* their configuration, its parameters, and its own
      # package version into one configuration_hash, and wipes the entire
      # cache when that hash moves — so an ecs.php ruleset edit can never be
      # masked by stale per-file entries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/changed_files_detector_*
          key: ${{ runner.os }}-ecs-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-ecs-
      # Blocking since 2026-08-15. It was non-blocking on the rationale that
      # "ECS checks whole files, not diffs, so pre-existing violations would
      # block unrelated commits" — that debt is gone (`ecs check` reports
      # zero violations tree-wide, verified against a tracked-files-only
      # `git archive HEAD` checkout, i.e. exactly what CI sees), so the
      # grandfathering no longer applies. lefthook.yml's `ecs` hook keeps its
      # `|| true` deliberately: it lints only staged files pre-commit, and
      # this job is the real gate.
      - run: composer lint:php

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # PHPStan's default resultCache/analysis cache lives under
      # sys_get_temp_dir()/phpstan (verified empirically: resultCache.php +
      # a much larger per-file cache/PHPStan/ tree) — no phpstan.neon
      # tmpDir override needed, just persist the runner's own default.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-
      # composer analyse:phpstan, not the bare phpstan binary -- the script
      # chains the phpstan-latte:compile pre-step (generates
      # _analysis/phpstan-latte/) ahead of the analysis; calling the binary
      # directly would silently skip template type-checking.
      - run: composer analyse:phpstan

  # Psalm was never gated in CI (see docs/REFERENCE.md's "Psalm gating is
  # moot, not just paused — but Psalm itself is back" decision) — its
  # global-function-resolution scanner didn't hold up at this codebase's
  # scale/style (non-namespaced procedural legacy code), so gating stays
  # moot regardless of whether the dependency is installed. `vimeo/psalm`
  # was dropped from composer.json entirely 2026-08-07, then reinstalled
  # 2026-08-11 (pinned to 7.x-dev) for real, local, best-effort use — no
  # CI job, no composer script wired to it.

  rector:
    name: Rector (dry-run, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Dry-run only, non-blocking — see docs/PLAN.md's Rector strategy.
      - run: vendor/bin/rector --dry-run
        continue-on-error: true

  coverage:
    name: Code coverage (pcov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: pcov
          extensions: ${{ env.PHP_EXTENSIONS }},pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # 0.1 is a ratchet floor just under the measured 0.2% Unit+Arch baseline
      # (~500 legacy files are un-namespaced and untouched by these suites).
      - run: composer test:coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # --abandoned=report, not the default (Composer's own `--abandoned`
      # default is "fail", not "report"). phpbench/phpbench (dev-only
      # benchmarking tool, never shipped) requires doctrine/annotations
      # ^2.0, which Composer flags abandoned with no replacement. Still
      # reported in the log below, just not escalated to a failure for a
      # transitive dev-only dependency we don't control -- real security
      # advisories still fail the job (--abandoned only affects abandoned-
      # package reporting, not the vulnerability-advisory exit code).
      - run: composer audit --abandoned=report
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # @lhci/cli@0.15.1 (latest, dev-only Lighthouse CLI, never shipped) pins
      # vulnerable tmp/uuid ranges with no fixed release available upstream —
      # re-check these on every Renovate bump of @lhci/cli.
      - run: |
          bun audit \
            --ignore=GHSA-52f5-9888-hmc6 \
            --ignore=GHSA-ph9p-34f9-6g65 \
            --ignore=GHSA-w5hq-g745-h8pq

  deptrac:
    name: Deptrac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/deptrac analyse --no-progress

  require-checker:
    name: composer-require-checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer require-checker

  composer-unused:
    name: composer-unused
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer unused

  composer-normalize:
    name: composer-normalize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Blocking, unlike ECS: composer.json carries no pre-existing layout
      # debt (it was normalized in the same commit that added the tool), the
      # check is deterministic, and `composer lint:composer:fix` resolves any
      # failure in one command.
      - run: composer lint:composer

  phpbench:
    name: PHPBench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Runs cleanly with 0 subjects; a no-op until tests/Bench/*.php exists.
      - run: vendor/bin/phpbench run --report=aggregate | tee phpbench-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpbench-report
          path: phpbench-report.txt
          retention-days: 30

  # ── JS/TS/CSS ────────────────────────────────────────────────────────────

  vitest:
    name: Vitest (TS unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test

  eslint:
    name: ESLint (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint:js

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint:md

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # `format` only, not `format:latte`. The Latte formatter is real and
      # passes its own test suite, but 90 of 135 templates have drifted out
      # of its style since P30's reformat landed (P31's sub-items edited
      # templates without re-running it, because nothing gated it). Gating
      # `format:latte` is P42's job, after that drift is cleared.
      - run: bun run format

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint:css

  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run knip

  size-limit:
    name: size-limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run size-limit

  k6-load:
    name: k6 load
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tests/Load/*.js doesn't exist yet — non-blocking (warning) per
      # docs/PLAN.md, a no-op until it's added.
      - if: hashFiles('tests/Load/**') != ''
        run: echo "k6 load surface not present yet"

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: bunx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
      - if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: bunx commitlint --from ${{ github.sha }}~1 --to ${{ github.sha }} --verbose

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          fail_level: error

  test-file-inventory:
    name: Test file inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every wired-up testsuite directory must contain at least one real
      # *Test.php file: Pest exits 0 on a --filter that matches nothing
      # inside a non-empty suite, so file presence is the only reliable
      # signal that a testsuite isn't silently running 0 tests.
      - run: |
          set -euo pipefail
          for dir in Unit Arch Integration Contract Browser; do
            count=$(find "tests/$dir" -maxdepth 1 -name '*Test.php' | wc -l)
            echo "tests/$dir: $count Test.php file(s)"
            if [ "$count" -eq 0 ]; then
              echo "::error::tests/$dir has no *Test.php files — its testsuite would silently run 0 tests"
              exit 1
            fi
          done

  doc-drift:
    name: Doc drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No composer install needed -- tools/doc-drift-check.php has zero
      # dependencies of its own, just PHP + the repo's docs/*.md files.
      - run: php tools/doc-drift-check.php

  # ── DB-backed suites ─────────────────────────────────────────────────────

  # Proves the real install-via-Migrations path (bin/piwigo migrations:migrate)
  # and the schema:dump drift guard across all 3 providers in
  # docs/REFERENCE.md's "hard-required bleeding-edge stack" decision's
  # provider matrix. mysql/mariadb legs stay lean (Unit/Db, Unit/Config, Arch smoke +
  # migrate + schema-drift check) since MySQL is already comprehensively
  # covered by the integration/contract/browser jobs below; MariaDB has no
  # other CI coverage at all, but this job's own smoke+migration proof is
  # its intended scope, not a full-suite duplication. The pgsql leg
  # additionally runs the full Integration/Contract/Browser suites --
  # IntegrationTestCase/BrowserTestHelpers support Postgres, so this is
  # the one leg with no other job anywhere proving Postgres for real.
  #
  # `HTTP_X_PIWIGO_ENV=test` is required on every bin/piwigo invocation
  # below -- Piwigo\Core\Env::testModeEnvFile() only loads .env.test (vs.
  # production .env) when that var is set; a bin/piwigo command run
  # without it silently targets whatever .env would resolve to instead.
  # Every real Pest suite (Integration/Contract/Browser/Unit/Arch) sets
  # this for its own process automatically via tests/bootstrap.php, so
  # only the raw bin/piwigo steps below need the explicit prefix.
  db-multi-provider:
    name: DB layer (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: mysql
            image: mysql:9.7
            port: 3306
            driver: mysqli
            user: root
          - provider: mariadb
            image: mariadb:12
            port: 3306
            driver: mysqli
            user: root
          - provider: pgsql
            image: postgres:18
            port: 5432
            driver: pgsql
            user: postgres
    services:
      db:
        image: ${{ matrix.image }}
        env:
          # mysql/mariadb read the MYSQL_* vars, postgres reads POSTGRES_*
          # -- each image ignores the vars meant for the other, so a single
          # combined env block covers all 3 matrix legs.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piwigo_test
          POSTGRES_PASSWORD: root
          POSTGRES_DB: piwigo_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          # pgsql (native driver, matching docs/REFERENCE.md's
          # native-platform-first library policy and its mysqli-not-pdo_mysql
          # precedent) added on top of the standard set -- unused but
          # harmless on the mysql/mariadb legs.
          extensions: ${{ env.PHP_EXTENSIONS }},pgsql
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - if: matrix.provider == 'pgsql'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: matrix.provider == 'pgsql'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - if: matrix.provider == 'pgsql'
        run: bun install --frozen-lockfile
      - if: matrix.provider == 'pgsql'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install Playwright + Chromium
        if: matrix.provider == 'pgsql' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium system deps only (browser binary cached)
        if: matrix.provider == 'pgsql' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Wait for the database to accept connections
        run: |
          if [ "${{ matrix.provider }}" = "pgsql" ]; then
            until PGPASSWORD=root pg_isready -h 127.0.0.1 -p ${{ matrix.port }} -U postgres > /dev/null 2>&1; do sleep 0.5; done
          else
            until mysqladmin ping -h127.0.0.1 -P${{ matrix.port }} -uroot -proot --silent > /dev/null 2>&1; do sleep 0.5; done
          fi
      - name: Write .env.test
        run: |
          cat > .env.test <<ENVEOF
          PIWIGO_DB_HOST=127.0.0.1
          PIWIGO_DB_PORT=${{ matrix.port }}
          PIWIGO_DB_USER=${{ matrix.user }}
          PIWIGO_DB_PASSWORD=root
          PIWIGO_DB_BASE=piwigo_test
          PIWIGO_DB_DRIVER=${{ matrix.driver }}
          PIWIGO_BASE_URL=http://localhost:8080
          ENVEOF
      - run: mkdir -p local && touch local/.installed.test
      - run: php bin/piwigo migrations:migrate --no-interaction
        env:
          HTTP_X_PIWIGO_ENV: test
      - run: vendor/bin/pest tests/Unit/Db tests/Unit/Config tests/Arch
      - run: php bin/piwigo schema:dump
        env:
          HTTP_X_PIWIGO_ENV: test
      - name: Verify install/piwigo_structure-{mysql,mariadb,pgsql}.sql has no drift
        # One committed dump per provider, mariadb included. It gets its own
        # file rather than sharing MySQL's because the two differ at the
        # engine level, not in formatting: `int unsigned` -> `int(11)
        # unsigned` (display widths MySQL 8.4 dropped), `CURRENT_TIMESTAMP` ->
        # `current_timestamp()`, omitted `COLLATE` clauses, and `json` ->
        # `longtext ... CHECK (json_valid(...))` since MariaDB has no native
        # JSON type -- 189 differing lines in all. Sharing one file made this
        # guard unsatisfiable on that leg; see SchemaDumpService's docblock.
        run: git diff --exit-code -- install/piwigo_structure-mysql.sql install/piwigo_structure-mariadb.sql install/piwigo_structure-pgsql.sql
      - if: matrix.provider == 'pgsql'
        name: Start PHP built-in server
        run: |
          # -t public, not -t . -- index.php/health.php/etc. only exist
          # under public/, not the repo root; see the install-flow job's
          # server-start step below for the full reasoning.
          php -S localhost:8080 -t public > /tmp/php-server.log 2>&1 &
          until curl -sf http://localhost:8080/index.php > /dev/null; do sleep 0.5; done
      - if: matrix.provider == 'pgsql'
        run: composer test:integration
      - if: matrix.provider == 'pgsql'
        run: composer test:contract
      - if: matrix.provider == 'pgsql'
        run: composer test:browser

