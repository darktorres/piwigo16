name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Opt third-party actions (e.g. ramsey/composer-install) into Node 24 ahead of
# the June 2nd, 2026 default switch. Our direct actions are already on v5+.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  style:
    name: PSR-12 (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/pint --test

  phpstan:
    name: PHPStan + PSR-4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer dump-autoload --strict-psr
      - run: vendor/bin/phpstan analyse --no-progress
