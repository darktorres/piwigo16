name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  style:
    name: PSR-12 (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/pint --test

  phpstan:
    name: PHPStan + PSR-4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer dump-autoload --strict-psr
      - run: vendor/bin/phpstan analyse --no-progress

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Create .env.test
        run: |
          cat > .env.test <<EOF
          PIWIGO_DB_HOST=127.0.0.1
          PIWIGO_DB_PORT=3306
          PIWIGO_DB_USER=root
          PIWIGO_DB_PASSWORD=root
          PIWIGO_DB_BASE=piwigo_test
          PIWIGO_DB_PREFIX=piwigo_
          PIWIGO_BASE_URL=http://localhost/piwigo16
          EOF
      - run: vendor/bin/phpunit --testsuite Unit

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: ramsey/composer-install@v4
      - run: composer audit --abandoned=fail
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: JS/CSS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
