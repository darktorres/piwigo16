name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - name: release tarball excludes dev deps
        run: |
          git archive --format=tar.gz HEAD -o /tmp/piwigo-tarball.tgz
          BAD=$(tar -tzf /tmp/piwigo-tarball.tgz | grep -E '^vendor/(phpstan|rector|phpunit|laravel|symfony)/' || true)
          rm -f /tmp/piwigo-tarball.tgz
          if [ -n "$BAD" ]; then
            echo "Tarball contains dev dependencies:"
            echo "$BAD"
            exit 1
          fi
      - name: strict_types coverage check
        run: |
          MISSING=$(find include admin install -name "*.php" \
            -not -path "*/smarty/*" -not -path "*/minify/*" -not -path "*/phpmailer/*" \
            -not -name "jshrink.class.php" -not -name "passwordhash.class.php" \
            -not -name "mdetect.php" -not -name "emogrifier.class.php" \
            -not -name "feedcreator.class.php" -not -name "phpqrcode.php" \
            -not -name "pclzip.lib.php" \
            -not -path "*/install/db/*" -not -path "install/db/*" \
            -not -path "*/language/*" -not -path "*/vendor/*" \
            | xargs grep -rL "declare(strict_types" 2>/dev/null || true)
          if [ -n "$MISSING" ]; then
            echo "Files missing declare(strict_types=1):"
            echo "$MISSING"
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpunit --testsuite Unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker compose build web
      - run: docker compose up -d --wait db web
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          BASE_URL: http://localhost:8090
          PIWIGO_DB_HOST: 127.0.0.1
          PIWIGO_DB_PORT: "3307"
          PIWIGO_DB_USER: piwigo
          PIWIGO_DB_PASSWORD: piwigo
          PIWIGO_DB_BASE: piwigo
          PIWIGO_INSTALL_DB_HOST: db
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpunit --testsuite Integration
