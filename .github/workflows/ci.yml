name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

env:
  PHP_EXTENSIONS: calendar,ctype,curl,dom,fileinfo,filter,gd,iconv,intl,libxml,mbstring,mysqli,openssl,session,simplexml,zlib

jobs:
  # ── PHP: lint / static analysis ─────────────────────────────────────────

  pest:
    name: Pest (unit + arch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test

  ecs:
    name: ECS (style, non-blocking until P5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # ECS checks whole files, not diffs, so pre-existing legacy violations
      # would block unrelated commits — not a real gate until P5 applies --fix
      # (see docs/PLAN-REPLAY.md P0 step 4 and lefthook.yml's matching `|| true`).
      - run: composer lint:php
        continue-on-error: true

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # PHPStan's default resultCache/analysis cache lives under
      # sys_get_temp_dir()/phpstan (verified empirically: resultCache.php +
      # a much larger per-file cache/PHPStan/ tree) — no phpstan.neon
      # tmpDir override needed, just persist the runner's own default.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-
      - run: vendor/bin/phpstan analyse --no-progress

  # Psalm is not gated in CI (see docs/adr/0026-pause-psalm-gating.md) —
  # its global-function-resolution scanner doesn't hold up at this
  # codebase's current scale/style (non-namespaced procedural legacy
  # code); resumes once P6+ typed/namespaced refactoring lands.

  rector:
    name: Rector (dry-run, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Not applied until P5 — see docs/PLAN-REPLAY.md's Rector strategy.
      - run: vendor/bin/rector --dry-run
        continue-on-error: true

  coverage:
    name: Code coverage (pcov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: pcov
          extensions: ${{ env.PHP_EXTENSIONS }},pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # 0.1 is a ratchet floor just under the measured 0.2% Unit+Arch baseline
      # (~500 legacy files are un-namespaced and untouched by these suites) —
      # expected to climb sharply from P5 onward.
      - run: composer test:coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # No --abandoned=fail: phpbench/phpbench (dev-only benchmarking tool,
      # never shipped) requires doctrine/annotations ^2.0, which Composer
      # flags abandoned with no replacement. Still reported in the log below,
      # just not escalated to a failure for a transitive dev-only dependency
      # we don't control.
      - run: composer audit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # @lhci/cli@0.15.1 (latest, dev-only Lighthouse CLI, never shipped) pins
      # vulnerable tmp/uuid ranges with no fixed release available upstream —
      # re-check these on every Renovate bump of @lhci/cli.
      - run: |
          bun audit \
            --ignore=GHSA-52f5-9888-hmc6 \
            --ignore=GHSA-ph9p-34f9-6g65 \
            --ignore=GHSA-w5hq-g745-h8pq

  deptrac:
    name: Deptrac (from P6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/deptrac analyse --no-progress

  require-checker:
    name: composer-require-checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer require-checker

  composer-unused:
    name: composer-unused
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer unused

  phpbench:
    name: PHPBench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Runs cleanly with 0 subjects until P12 adds tests/Bench/*.php.
      - run: vendor/bin/phpbench run --report=aggregate | tee phpbench-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpbench-report
          path: phpbench-report.txt
          retention-days: 30

  plan-lint:
    name: plan-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer plan-lint

  # ── JS/TS/CSS ────────────────────────────────────────────────────────────

  vitest:
    name: Vitest (TS unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test

  eslint:
    name: ESLint (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint:js

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint:css

  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run knip

  size-limit:
    name: size-limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run size-limit

  k6-load:
    name: k6 load (from P29)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # tests/Load/*.js doesn't exist until P29 — non-blocking (warning) per
      # docs/PLAN-REPLAY.md, no-op until then.
      - if: hashFiles('tests/Load/**') != ''
        run: echo "k6 load surface not present yet (P29)"

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: bunx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
      - if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: bunx commitlint --from ${{ github.sha }}~1 --to ${{ github.sha }} --verbose

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error

  test-file-inventory:
    name: Test file inventory (P0 "just test" lesson)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Every wired-up testsuite directory must contain at least one real
      # *Test.php file. Catches the exact failure the 16.x-v2 lesson describes:
      # a testsuite silently running 0 tests (Pest exits 0 on a --filter that
      # matches nothing inside a non-empty suite, so file presence is the only
      # reliable signal). tests/Integration/ hit exactly this until this phase
      # added DatabaseConnectionTest.php.
      - run: |
          set -euo pipefail
          for dir in Unit Arch Integration Contract Browser; do
            count=$(find "tests/$dir" -maxdepth 1 -name '*Test.php' | wc -l)
            echo "tests/$dir: $count Test.php file(s)"
            if [ "$count" -eq 0 ]; then
              echo "::error::tests/$dir has no *Test.php files — its testsuite would silently run 0 tests"
              exit 1
            fi
          done

  # ── DB-backed suites ─────────────────────────────────────────────────────

  integration:
    name: Pest (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piwigo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Provision piwigo_test from the committed fixture
        run: |
          mysql -h127.0.0.1 -uroot -proot piwigo_test < tests/Fixtures/piwigo-17.0.sql
          until mysql -h127.0.0.1 -uroot -proot piwigo_test -e 'SELECT COUNT(*) FROM piwigo_images;' > /dev/null 2>&1; do sleep 0.5; done
      - name: Write .env.test
        run: |
          cat > .env.test <<'ENVEOF'
          PIWIGO_DB_HOST=127.0.0.1
          PIWIGO_DB_PORT=3306
          PIWIGO_DB_USER=root
          PIWIGO_DB_PASSWORD=root
          PIWIGO_DB_BASE=piwigo_test
          PIWIGO_DB_PREFIX=piwigo_
          PIWIGO_BASE_URL=http://localhost:8080
          ENVEOF
      - run: mkdir -p local && touch local/.installed.test
      - run: composer test:integration

  # P15: Doctrine Migrations run for real against MySQL 9.7, MariaDB 12.x,
  # and PostgreSQL 18 from a genuinely blank database (no committed fixture
  # -- the DB-layer test files exercise ConfigRepository/EntityManager/
  # SchemaParity against whatever the migrations themselves produce). This
  # is additive to, not a replacement for, the `integration` job above: the
  # bulk of Integration/Contract/Browser/Visual suites exercise legacy
  # procedural code that isn't provider-portable yet (P17-23 domain
  # migration work), so they stay MySQL-only -- and even the ORM-based
  # Integration test files here only run on the mysql/mariadb legs, since
  # IntegrationTestCase's resetDatabase()/loadFixture() are themselves
  # hard-coded to mysqli (see the step-level comment below). schema:dump
  # also writes install/schema/{provider}.sql for real here -- the final
  # step diffs that against the committed copy, so a migration that drifts
  # from the committed schema snapshot fails the build instead of shipping
  # silently stale install artifacts.
  db-multi-provider:
    name: DB layer (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: mysql
            image: mysql:9.7
            port: 3306
            driver: mysqli
            user: root
          - provider: mariadb
            image: mariadb:12
            port: 3306
            driver: mysqli
            user: root
          - provider: pgsql
            image: postgres:18
            port: 5432
            driver: pgsql
            user: postgres
    services:
      db:
        image: ${{ matrix.image }}
        env:
          # mysql/mariadb read the MYSQL_* vars, postgres reads POSTGRES_*
          # -- each image ignores the vars meant for the other, so a single
          # combined env block covers all 3 matrix legs.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piwigo_test
          POSTGRES_PASSWORD: root
          POSTGRES_DB: piwigo_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          # pgsql (native driver, matching ADR-0021's mysqli-not-pdo_mysql
          # precedent) added on top of the standard set -- unused but
          # harmless on the mysql/mariadb legs.
          extensions: ${{ env.PHP_EXTENSIONS }},pgsql
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Wait for the database to accept connections
        run: |
          if [ "${{ matrix.provider }}" = "pgsql" ]; then
            until PGPASSWORD=root pg_isready -h 127.0.0.1 -p ${{ matrix.port }} -U postgres > /dev/null 2>&1; do sleep 0.5; done
          else
            until mysqladmin ping -h127.0.0.1 -P${{ matrix.port }} -uroot -proot --silent > /dev/null 2>&1; do sleep 0.5; done
          fi
      - name: Write .env.test
        run: |
          cat > .env.test <<ENVEOF
          PIWIGO_DB_HOST=127.0.0.1
          PIWIGO_DB_PORT=${{ matrix.port }}
          PIWIGO_DB_USER=${{ matrix.user }}
          PIWIGO_DB_PASSWORD=root
          PIWIGO_DB_BASE=piwigo_test
          PIWIGO_DB_PREFIX=piwigo_
          PIWIGO_DB_DRIVER=${{ matrix.driver }}
          PIWIGO_BASE_URL=http://localhost:8080
          ENVEOF
      - run: mkdir -p local && touch local/.installed.test
      - run: php bin/piwigo migrations:migrate --no-interaction
      - run: vendor/bin/pest tests/Unit/Db tests/Unit/Config tests/Arch
      # tests/Integration/IntegrationTestCase's resetDatabase()/loadFixture()
      # are hard-coded to mysqli (newMysqli() + the `mysql` CLI client) --
      # a real, structural PG incompatibility, not an oversight to route
      # around here. Every other Integration test file inherits that same
      # base class, so this run is genuinely mysql/mariadb-only; the
      # explicit `schema:dump` CLI step below (not the SchemaDumpServiceTest
      # PHPUnit test, same reason) is what proves PostgreSQL for real.
      - if: matrix.provider != 'pgsql'
        run: vendor/bin/pest tests/Integration/ConfigRepositoryTest.php tests/Integration/EntityManagerSmokeTest.php tests/Integration/SchemaParityTest.php
      - run: php bin/piwigo schema:dump
      - name: Verify install/schema/${{ matrix.provider }}.sql has no drift
        run: git diff --exit-code -- install/schema/${{ matrix.provider }}.sql

  contract:
    name: Pest (WS contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: piwigo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}
