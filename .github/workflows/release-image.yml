name: Release image

# SEC-54 (docs/PLAN-REPLAY.md P4): sign container images + release artifacts.
# Runs only on a published GitHub Release (release-please's output, see
# release-please.yml) — never on every push, so untrusted PR builds can't
# get a signature. Keyless: no long-lived signing key, Fulcio/Rekor bind
# the signature to this workflow's own GitHub Actions OIDC identity.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-push-sign:
    name: Build, push, and sign the release image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lowercase repository name for GHCR
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image (keyless)
        run: cosign sign --yes "ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.push.outputs.digest }}"
