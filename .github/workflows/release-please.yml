name: release-please

# release-please tracks *this* branch's own release cadence, so
# target-branch is pinned explicitly below rather than relying on
# "detected by default" — `17.x-rewrite` is this repo's GitHub default
# branch, but pinning it explicitly avoids ever silently retargeting a
# release cadence if the default branch changes again in the future.
on:
  push:
    branches: ["17.x-rewrite"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: "17.x-rewrite"
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
