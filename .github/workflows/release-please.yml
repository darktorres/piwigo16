name: release-please

# This repo's actual GitHub default branch is `16.x-rewrite` (an unrelated,
# earlier rewrite lineage — see docs' P3 plan notes) and `17.x-rewrite` isn't
# pushed to origin yet. release-please tracks *this* branch's own release
# cadence, so target-branch is pinned explicitly below rather than relying
# on "detected by default" (which would resolve to the wrong branch).
on:
  push:
    branches: ["17.x-rewrite"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: "17.x-rewrite"
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
