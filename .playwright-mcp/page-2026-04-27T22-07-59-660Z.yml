              - text: Automation features, powered by Artificial Intelligence (AI) for your Piwigo gallery.
              - text: "Piwigo AI introduces automatic image analysis features:"
              - text: "- Automatic generation of image descriptions"
              - text: "- Automatic generation of image tags"
              - text: "- Text detection (OCR)"
              - text: AI analysis are performed on upload and through a Batch Manager action.
              - text: AI does not run on your Piwigo installation. It only runs on dedicated servers managed by Piwigo Team. These servers are hosted by OVH (French company) and are located in France. Images are temporarily sent to our AI servers for analysis and are immediately deleted once processing is complete. No data is stored on our servers after processing.
