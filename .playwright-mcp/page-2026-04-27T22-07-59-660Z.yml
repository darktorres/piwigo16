            - generic [ref=e307]:
              - text: The face_tag_editor plugin allows you to edit face tags.
              - text: "With this plugin, you can:"
              - text: "- create/delete face frames"
              - text: "- move and resize a face frame"
              - text: "- to rename a face, double-click on the frame."
              - text: "- enter/edit the photo description"
              - text: To use the plugin, you must be a webmaster, administrator, or a user belonging to the FaceTag group.
              - text: "To view the results, you must install/activate the face_tag plugin: https://fr.piwigo.org/ext/index.php?eid=1051"
              - text: This plugin allows you to instantly view the results of face_tag_editor.
              - text: Face tags are saved in the photo metadata in MPReg (Microsoft Photo Region) and MWG-RS (Metadata Working Group - Region Schema) formats, as with digiKam.
              - text: Existing face tags created in these formats by other software are recognized by face_tag_editor.
              - text: JPG files must have write permissions.
              - text: For Synology NAS devices, you must grant read and write permissions to the \'http\' group on the relevant directories ./data ./upload ./galleries
              - text: Tag editing works on photos in ./upload, directly in ./galleries, and in ./galleries with symbolic links.
              - text: The first time a face tag edit is saved, a copy of the photo xyz.jpg is created under the name xyz.jpg.original (whether in ./galleries or ./upload). A \'Restore\' button in the interface allows you to revert to the original photo. (optional)
              - text: The tags are added to the Piwigo tag list.
