              - text: You can then browse through the albums, and each photo/video selected will be cast to the television.
              - text: To stop casting, click on either icon
              - text: For videos, a remote control appears below the video, allowing you to start/stop the video, navigate through the video, mute or play the sound, and adjust the volume.
              - text: The ‘piwigo-videojs’ plugin must be installed.
              - text: The bootstrap-darkroom, modus and elegant themes are supported.
              - text: Works on Chrome, Edge, and Opera.
