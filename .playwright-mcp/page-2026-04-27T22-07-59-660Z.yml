                - generic [ref=e1412]: login
              - generic [ref=e1413]:
                - text: "The External Authentication plugin supports login based on the identity provided by the webserver (aka the Remote User), which is usually supplied via proxy servers or webserver modules (eg. \"Basic Auth\"). It differs from the Piwigo \"apache_authentication\" option by providing a greater degree of flexibility, including:"
                - text: "- Control over which variable(s) are used for authentication"
                - text: "- Piwigo login will always follow changes in (recognized) Remote Users"
                - text: "- Native Piwigo logins possible when the Remote User is considered a guest"
                - text: "- Option to copy webserver supplied passwords to Piwigo accounts"
                - text: "- External login/logout URLs replacing or co-existing with native ones"
                - text: "- Possibily to auto-register unknown Remote Users as new Piwigo users"
                - text: "- Control over auto-registration profiles, passwords, status and notifications"
                - text: "- Flexible list of Remote Users considered guests"
                - text: This plugin is incompatible with the $conf['apache_authentication'] option, and will auto-disable if it's set.
                - text: "Fallback Authentication is optional, and permits native Piwigo logins when the current Remote User is considered a guest. NOTE: If Remote User auto-registration is disabled, any Remote User unknown to Piwigo is considered a guest. If Fallback is disabled, Piwigo logins will always match the current Remote User."
                - text: The plugin makes every effort to prevent un-intentional account lockout, and is always disabled upon activation to permit configuration before login enforcement is enabled (which may immediately log the current session out!).
                - text: Debug logging can be enabled on the plugin's admin page, or by setting $conf['externalauth_debug'] = true
