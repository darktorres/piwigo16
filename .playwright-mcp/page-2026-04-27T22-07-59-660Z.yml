              - generic [ref=e1699]:
                - text: This is a simple modification of Piwigo photo gallery Virtualize plugin by plg. Original Virtualize plugin converts ALL physical albums (located under \'galleries\' folder) to virtual (under \'upload\' folder) at once. For galleries with big amount of photos and complicated structure this procedure could be too hard.
                - text: This plugin moves all your photos from ONE album with given Id from \'galleries\' (added with the synchronization process) to \'upload\' and mark this category as virtual. This will allow to virtualize (in Piwigo terms) your gallery in steps, not at once.
                - text: Make sure you have a backup of your \'galleries\' directory and a dump of your database.
                - text: Once category is virtual, you can move it the way you want, which is not possible for physical category. And you can change freely the structure of you gallery created, for example, during automatic conversion from Gallery2 to Piwigo.
                - text: "Plugin was checked for: Piwigo version: 2.9.3 PHP version: 7.0.27-0+deb9u1 MySQL version: 5.7.21-20"
                - text: "2022-12-08 Plugin was checked for Piwigo 13.3.0 PHP: 7.4.33 MySQL: 8.0.29-21"
