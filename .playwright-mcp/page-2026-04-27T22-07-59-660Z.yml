                - text: The problem with using physical albums is that if a photo file is moved to a different folder, the next synchronization process will delete the original file info from the database and re-create it in the new location. This means all of the metadata associated with the item (tags, description, etc.) are lost and have to be entered again.
                - text: Physical Photo Move (PPM) is an extension that allows an existing item (photo, video, or album) in a physical folder (i.e., not in the upload folder and linked into a virtual album) to be moved to another folder, preserving all metadata.
