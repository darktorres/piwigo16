              - text: Frontend Features
              - text: Displays 6 emoji reactions with a live counter per image. Stores user reactions using a user hash for recognition. Allows only one reaction per image and user. Works with both registered and anonymous users. Shows total number of all reactions across the gallery. Ideal for collecting emotional feedback from visitors.
              - text: Backend Features
              - text: Overview of all reactions with options to reset individual or all entries.
              - text: Settings
              - text: Configurable reaction flood protection (max. reactions per period, period in hours). Customizable number of entries per page in the reaction list.
              - text: Emoji Templates
              - text: "Two switchable layouts: buttons_1.tpl and buttons_2.tpl for easy integration."
              - text: Privacy Compliant
              - text: IP addresses are stored in encrypted form and cannot be reverse-engineered.
