              - generic [ref=e3727]:
                - text: Tag Access Management Plugin
                - text: This plugin grants access to albums based on tags. If a tag [keyword in piwigo] appears at least once in an album, the user associated with that tag is automatically granted access to the album.
                - text: "Features:"
                - text: "* Automatic assignment of album access based on keywords."
                - text: "* Support for multiple users and complex tag combinations."
                - text: "* Fully integrated with the Piwigo database structure."
                - text: "* Debugging options for easier troubleshooting."
                - text: "* Works with albums and subalbums (currently no support for deeply nested subfolders)."
                - text: "Requirements:"
                - text: "* Piwigo version 11.0 or later."
                - text: "* Write access to Piwigo database tables."
                - text: "* Tags must be recognized as keywords by Piwigo. Tags from any program can be used as long as they are imported into Piwigo."
                - text: "How to Use:"
                - text: "* go to settings of \\\"tag access management\\\""
                - text: "* Link the desired tags to existing Piwigo users."
                - text: "* Press the button to apply the assignments."
                - text: "* redo the apply button everytime you add new pictures with keywords"
                - text: That’s it!
                - text: "Notes:"
                - text: "* New pictures are not automatically processed. The plugin must be rerun after adding new pictures."
                - text: "* Ensure that tag assignments are accurate before applying changes."
                - text: "* The plugin has been successfully tested on a collection with over 120,000 pictures and 500 keywords"
