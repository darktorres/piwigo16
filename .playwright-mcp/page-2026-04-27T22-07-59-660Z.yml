              - generic [ref=e1621]:
                - text: A small and lightweight Captcha solution to keep your installation free from bot spam comments and bot fake registrations.
                - text: It does not rely on any remote resources - like Recaptcha from Google or any others. This means you do not have to mention it in your GDPR compliance declaration. If Google enables Recaptcha V3 soon, Recaptcha will act like a tracker, since the advice is to implement it on every single page of your website. You will dislike Google for this, hopefully.
                - text: Installation is as easy as with any other plugin. Since this plugin does not use any database tables it does not matter which MySQL version you are using.
                - text: The Captcha works the classic way. There are some configuration options like colors, OCR confusion, dimensions and length of challenge. Just explore the possibilities in the plugin area of Piwigo admin.
                - text: Yes, it is the 5th or so Captcha solution, but all other solutions rely on remote resources or are not maintained anymore.
                - text: You can protect comments below pictures, comments below categories (plugin Comments on Albums), user registration, guestbook entries (plugin GuestBook) and the contact form (plugin Contact Form).
                - text: The plugin is based on work of mistic and Stefan Petre.
                - text: Would love to receive feedback.
