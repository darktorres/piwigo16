            - generic [ref=e3205]:
              - generic [ref=e3207]: security
              - generic [ref=e3208]:
                - text: This plugin adds password policies.
                - text: "**** Important: Some features have been migrated from the UserAdvManager plugin (version < 2.50.x ) . This plugin is therefore only compatible with the 2.51.x and upper UserAdvManager versions. ****"
                - text: "List of plugin features :"
                - text: "* Complexity of passwords chosen by users (or admin) when registering"
                - text: If enabled, a password complexity score must be set. All passwords chosen not respecting this score will be rejected. The administration module of the plugin allows to test the complexity configuration.
                - text: "* Renewal passwords policy"
                - text: Enables the management tab in plugin administration panel to list registered user and allows to manually initiate a renewal of the password of one or more registered users.
                - text: At their next login , they will be automatically redirected to their profile page and prompted to change their password. And this, until the action is performed.
                - text: "* Management of failed login attempts due to incorrect password"
                - text: Allows to define a maximum number of login attempts with incorrect password. Beyond this limit, the user account is locked and can no longer connect to the gallery. He should contact the administrator to request the unlocking.
                - text: The administrator can then perform the unlocking in the users management tab of the plugin where a symbol will show locked accounts.
