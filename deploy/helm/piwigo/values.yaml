replicaCount: 1

image:
  repository: ghcr.io/piwigo/piwigo
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: piwigo.example.invalid
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

# PIWIGO_DB_PASSWORD is deliberately absent here — set via
# --set db.existingSecret=... / a values override, never committed.
db:
  host: piwigo-mysql
  user: piwigo
  base: piwigo
  prefix: piwigo_
  existingSecret: ""
  existingSecretPasswordKey: db-password

persistence:
  data:
    size: 1Gi
  local:
    size: 64Mi
  galleries:
    size: 20Gi
  upload:
    size: 5Gi
  storageClassName: ""

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Rootless runtime — mirrors docker-compose.yml (docs/PLAN-REPLAY.md P4).
# capabilities.add: verified empirically that FrankenPHP/Caddy wants
# CAP_NET_BIND_SERVICE at startup regardless of which port it binds — not
# just for ports below 1024 as usual — so this narrow exception is
# unavoidable with this runtime; everything else stays dropped.
securityContext:
  runAsNonRoot: true
  runAsUser: 33 # www-data
  fsGroup: 33 # so emptyDir volumes (tmp, caddy-data, caddy-config) are writable by it
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
