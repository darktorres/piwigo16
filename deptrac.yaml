deptrac:
  paths:
    - ./src/Piwigo
  layers:
    - name: L0Data
      collectors:
        - type: classLike
          value: ^Piwigo\\(Common|Event|Exception)\\.*
    # L1 Infrastructure — Cache, Session, Config, Core, Db
    # (Piwigo\Db\DbCredentials), and Backup (Piwigo\Backup\BackupService)
    # are infrastructure-adjacent, with no domain-layer dependency.
    # Piwigo\Lang\Translator/LangService share the same Core-data +
    # Service-layer split as Config, no domain-layer dependency:
    # LangService::loadLanguageForPlugin() takes the active locale as an
    # explicit parameter rather than reading Users\CurrentUser itself,
    # because L1Infrastructure may only depend on L0Data, not upward on
    # L2aCoreDomain -- callers resolve the locale instead.
    # Piwigo\Storage\StorageRegistry is a technical file-I/O capability
    # alongside Cache/Db, no domain-layer dependency; it is a plain
    # container-resolved service, not a self-managed singleton -- every
    # real reader takes it via constructor injection.
    # Piwigo\Audit\AuditRepository/Service is a technical, cross-cutting
    # logging capability alongside Cache/Storage/Mail(-shaped), no
    # domain-layer dependency of its own; it is injected INTO L2a/L2b
    # domain services (Users/Group), never the reverse, matching every
    # other L1 infrastructure class here.
    # Piwigo\Validation\InputValidator only depends on
    # Piwigo\Core\ValidationPattern (same-layer); its optional
    # `HtmlRenderingInterface` constructor param (also L1) is how it
    # reports a hacking-attempt failure without depending on the
    # concrete Piwigo\Html\HtmlService (L3) directly.
    # Piwigo\PluginConfig\EventDispatcher is a generic pub/sub bus with
    # no first-party (Piwigo\) dependencies, reachable from every layer,
    # including real L1->L2b and L2a->L2b callers (e.g. Config\ConfigDb,
    # Core\ThemeCatalog, Cache\PermissionCacheInvalidator;
    # Auth\AuthService, Users\*, Category\*, Image\*, Group\GroupService,
    # Tag\TagService) -- the same "technical, cross-cutting capability,
    # injected INTO L2a/L2b, never the reverse" shape as Cache/Session/
    # Storage/Audit above, so L1Infrastructure is both the lowest layer
    # that covers every real caller and the architecturally correct fit.
    # Its namespace-mate PluginRepository stays in L2bExtendedDomain (see
    # its own comment there). Any future class added to this namespace
    # needs the same deliberate placement, not a silent gap.
    # The photo sort order used to live in a Piwigo\Sort namespace collected
    # here, because it fused two jobs: naming sort fields (vocabulary) and
    # emitting SQL columns, dialect functions and DQL paths (rendering). The
    # rendering half is what pinned it to this layer, and the vocabulary half
    # is what L1 Config\{CurrentConfig,ConfigService} actually needs -- so
    # the whole thing sat in L1 to satisfy the stricter of the two.
    # It is now split along that seam: Piwigo\Common\ValueObject\
    # {PhotoSortOrder,PhotoSortField} is pure vocabulary with zero
    # dependencies (L0Data, where Config may depend on it downward), and
    # Piwigo\Db\{SortRenderer,OrderByClause} holds the Connection and does
    # the rendering (L1, where L2a repositories may use it). No namespace
    # needs a special placement here any more.
    - name: L1Infrastructure
      collectors:
        - type: classLike
          value: ^Piwigo\\(Config|Core|Db|Cache|Session|Backup|Lang|Storage|Audit|Validation)\\.*
        - type: classLike
          value: ^Piwigo\\PluginConfig\\EventDispatcher$
    # L2a Core Domain — Piwigo\Group\GroupRepository/GroupService sits at
    # this layer rather than the more natural-looking L2bExtendedDomain:
    # Permission\PermissionRepository/PermissionService (Permission
    # domain, L2a) query user_group/group_access directly, a real
    # dependency from Permission onto Group, and L2a may not depend
    # sideways on L2b.
    # Piwigo\Site/Piwigo\Metadata/Piwigo\Activity moved here from
    # L2bExtendedDomain for `0.3` wave 3 (categories.site_id modeled as a
    # real #[ORM\ManyToOne] CategoryEntity->SiteEntity association):
    # Piwigo\Category (L2a) needed to depend on Piwigo\Site, which L2b
    # placement forbade. The three move together, not just Site alone,
    # because Site\LocalSiteReader depends on Metadata, and Metadata
    # depends on Activity -- moving only Site would have just relocated
    # the violation onto Site->Metadata. Audited every cross-namespace
    # `use` in all three namespaces (recursively, not just top-level
    # files) before moving: every other dependency any of the three has is
    # already L0Data/L1Infrastructure/L2aCoreDomain, so this is the full
    # chain, not a partial fix. Confirmed empirically too -- `deptrac
    # analyse` reports 0 violations both right after this move (before the
    # association existed) and with the association declared.
    - name: L2aCoreDomain
      collectors:
        - type: classLike
          value: ^Piwigo\\(Auth|Users|Permission|Category|Image|Tag|Group|Site|Metadata|Activity)\\.*
    # L2b Extended Domain — every other first-party domain namespace.
    # Explicit enumeration (not a catch-all regex) so a namespace added
    # later has to be deliberately placed in the right layer instead of
    # silently falling into this one.
    # Piwigo\Csrf\CsrfService is deliberately built with no HtmlService
    # dependency -- check() returns ?bool instead of calling
    # accessDenied()/badRequest() itself, so it can live here without an
    # upward L2b->L3 dependency on Html; checkOrFail() takes the renderer
    # and redirect service as explicit parameters instead.
    # Piwigo\Permalink\PermalinkRepository/Service has no other
    # domain-namespace dependency, plain constructor injection.
    # Piwigo\Feed\FeedHelper injects nothing beyond PHP's own
    # DateTimeImmutable.
    # Piwigo\Comment\CommentRepository/Service constructor-injects
    # Piwigo\Auth\EphemeralKeyService (anti-spam key on anonymous
    # posts), a real L2b -> L2a dependency, always allowed.
    # Piwigo\Rate\RateService constructor-injects Piwigo\Auth\CookieService
    # (the anonymous-rater cookie), same L2b -> L2a shape as Comment's
    # EphemeralKeyService.
    # Piwigo\Caddie\CaddieRepository, Piwigo\Rate\RateRepository,
    # Piwigo\Feed\FeedRepository, and Piwigo\History\HistoryRepository are
    # plain Doctrine ORM entity repositories with no custom constructor of
    # their own.
    # Piwigo\Notification\NotificationRepository/Service
    # constructor-injects Piwigo\Permission\PermissionService
    # (getSqlConditionFandF()), a real L2b -> L2a dependency, always
    # allowed. Neither it nor NotificationByMailRepository/Service inject
    # MailerInterface -- mail sending in this domain stays a
    # pwg_mail()-style free-function call.
    # Piwigo\Telemetry\TelemetryService constructor-injects Doctrine's
    # EntityManagerInterface and Piwigo\Config\ConfigRepository directly
    # (ConfigRepository is L1), no Repository of its own and no other
    # domain-namespace dependency.
    # Piwigo\Section\SectionContextRegistry holds request-scoped mutable
    # state (set()/current()/reset()), resolved as a shared instance via
    # the container rather than a self-managed static facade.
    # Piwigo\PluginConfig\PluginRepository is a plain Doctrine ORM entity
    # repository (extends EntityRepository), doesn't depend on
    # Piwigo\Admin\PluginMaintain (that `instanceof` check lives in
    # Admin\PluginLoader/Admin\Extensions\ExtensionLifecycle instead), so
    # L2b's inability to depend on L4Integration never actually comes
    # into play here. PluginEntity (the ORM entity Admin\PluginLoader
    # fetches via the EntityManager), Projection\Plugin
    # (PluginRepository's own read-shape DTO), and PluginState
    # (PluginEntity's own `state` column enum type) ride along in the
    # same collector as PluginRepository -- without it, these classes
    # would have no layer at all and every dependency touching them
    # would go unchecked. PluginMigrationEntity/PluginMigrationRepository
    # relocated here from Admin\Extensions\ in P27.3 -- PluginRegistry
    # (L3Presentation) needs this ledger directly, and L3 may depend
    # downward on L2b, so this is the coherent placement beside
    # PluginEntity/PluginRepository, matching deptrac's own existing
    # "moved because a new real caller needs it at a layer that can
    # reach it" precedent. PluginState was missed by this exact fix the
    # first two times it was applied to this namespace (EventHandler,
    # then PluginEntity/Projection\Plugin) -- a periodic
    # `deptrac analyse --report-uncovered` check is worth adding
    # alongside the 0-violations gate below, given the pattern.
    - name: L2bExtendedDomain
      collectors:
        - type: classLike
          value: ^Piwigo\\(Search|Calendar|Url|Csrf|Permalink|Feed|Filter|Comment|Rate|Caddie|History|Notification|Telemetry|Section)\\.*
        - type: classLike
          value: ^Piwigo\\PluginConfig\\(PluginRepository|PluginEntity|PluginState|Projection\\Plugin|PluginMigrationEntity|PluginMigrationRepository)$
    # L3 Presentation — Http\Middleware\RoutingMiddleware depends on
    # Routing\Router, and L3 may only depend on layers at or below
    # itself, so Routing lives at L3 too (same-layer, always allowed).
    # Piwigo\Http\HttpClientService is a PSR-18 wrapper (implements
    # Psr\Http\Client\ClientInterface) around the app's shared Symfony
    # HTTP transport, with an SSRF guard.
    # Piwigo\Mail\MailService constructs a real Piwigo\Template\Template
    # (Latte-rendered mail/*.latte themes) to build outgoing mail, so it
    # sits at L3Presentation/L4Integration rather than L1Infrastructure,
    # same layer as Template itself (same-layer deps are always
    # allowed). This is why L2aCoreDomain/L2bExtendedDomain classes may
    # not constructor-inject MailService directly -- L2a/L2b may not
    # depend on L3Presentation. Piwigo\Core\MailerInterface
    # (L1Infrastructure) is implemented by MailService and bound in
    # config/container.php; Users\UserService (L2a) and
    # Comment\CommentService/Search\SearchService (L2b)
    # constructor-inject the interface instead of the concrete class.
    # Both directions are allowed (L3->L1 for MailService implementing
    # it, L2a/L2b->L1 for the domain classes depending on it) -- see
    # MailerInterface's own docblock for the full reasoning.
    # Picture\PictureCommentRenderer/PictureMetadataRenderer construct an
    # L2b service directly and are themselves called from a Controller,
    # same shape as Page\PageHeaderRenderer, same layer.
    # Piwigo\Listener\UploadFormatListener is carved out of the general
    # Listener\* match below and reassigned to L4Integration instead (see
    # that layer's own collector) -- it exists purely to delegate to
    # Piwigo\Admin\Upload\UploadService's static per-format handlers,
    # which is itself L4Integration (heavy EntityManagerInterface/
    # DbCredentials/StorageRegistry dependencies, genuinely an
    # edge-of-the-app class, not something to relocate just to satisfy
    # this one caller). Nothing outside
    # RequestBootstrap (also L4Integration, same-layer deps always
    # allowed) depends on it, so this carve-out is safe.
    # Piwigo\PluginConfig\{ExtensionInterface,ExtensionContext,
    # ExtensionSession,PluginManifest,ThemeManifest} (P27.1/P27.2) sit here
    # rather than PluginConfig's other two layers (EventDispatcher at
    # L1Infrastructure; PluginRepository/PluginEntity at
    # L2bExtendedDomain, both above): ExtensionContext needs read access
    # to Config/Lang/Session (L1), CurrentUser/UserService (L2a), and
    # CurrentTemplate (L3) -- L3Presentation is the lowest layer that
    # covers all three, matching this layer's own established "L3 may
    # depend on L2b/L2a/L1/L0" ruleset. redirect() doesn't push it to L4:
    # Core\RedirectServiceInterface already lives at L1Infrastructure.
    # ExtensionInterface/PluginManifest/ThemeManifest ride along in the
    # same collector purely because ExtensionInterface::boot() takes
    # ExtensionContext as a parameter -- without this, they'd have no
    # layer at all. Piwigo\PluginConfig\Facade\ImageReadFacade (its own
    # sub-namespace) needs Caddie (L2b) + Image/Category (L2a) read
    # access, same reasoning, same layer. PluginRegistry/ThemeRegistry
    # (P27.3) join the same layer as ExtensionContext, since they
    # construct and boot() every extension instance -- both need
    # PluginMigrationRepository/PluginRepository (L2b, above) and
    # Core\ThemeRepository (L1, below), both allowed downward
    # dependencies from L3. ExtensionContextFactory composes the exact
    # same collaborators ExtensionContext itself does, same layer.
    # SettingsPageInterface (P27.15) rides the same collector as
    # ExtensionInterface, for the identical reason: its own
    # handleSettingsRequest() has no ExtensionContext dependency of its
    # own, but it has nowhere else to go and PluginRegistry/ThemeRegistry
    # both reference it directly (the manifest-time `hasSettings`
    # validation). CurrentPluginRegistry (P27.15) is the
    # Config\CurrentConfigService-shaped bridge letting
    # Controller\Admin\PluginSubController (L4) reach the one real,
    # already-`bootActive()`d PluginRegistry instance -- same layer as
    # PluginRegistry itself, which it wraps. ApiRouteProviderInterface
    # (P29.6) rides the same collector for the identical reason
    # SettingsPageInterface does: its own registerApiRoutes() has no
    # ExtensionContext dependency of its own (a route's real controller
    # gets its own dependencies via plain container autowiring later,
    # not via this interface), but it has nowhere else to go and
    # PluginRegistry::registerApiRoutes() references it directly (the
    # manifest-time `hasApiRoutes` validation).
    - name: L3Presentation
      collectors:
        - type: classLike
          value: ^Piwigo\\(Html|Http|Menu|Page|Template|Asset|Routing|Mail|Picture)\\.*
        - type: classLike
          value: ^Piwigo\\Listener\\(?!UploadFormatListener$).+
        - type: classLike
          value: ^Piwigo\\PluginConfig\\(ExtensionInterface|ExtensionContext|ExtensionContextFactory|ExtensionSession|PluginManifest|ThemeManifest|PluginRegistry|ThemeRegistry|PluginValidationException|PluginDependencyException|ThemeValidationException|ThemeDependencyException|SettingsPageInterface|CurrentPluginRegistry|ApiRouteProviderInterface)$
        - type: classLike
          value: ^Piwigo\\PluginConfig\\Facade\\.*
    # L4 Integration — Piwigo\Command (bin/piwigo's Symfony Console
    # commands) has the same edge-of-the-app shape as Controller.
    - name: L4Integration
      collectors:
        - type: classLike
          value: ^Piwigo\\(Admin|Bootstrap|Command|Controller|Job)\\.*
        - type: classLike
          value: ^Piwigo\\Listener\\UploadFormatListener$
  ruleset:
    # Each layer may depend only on layers below it — standard layered
    # architecture.
    L4Integration:
      - L3Presentation
      - L2bExtendedDomain
      - L2aCoreDomain
      - L1Infrastructure
      - L0Data
    L3Presentation:
      - L2bExtendedDomain
      - L2aCoreDomain
      - L1Infrastructure
      - L0Data
    L2bExtendedDomain:
      - L2aCoreDomain
      - L1Infrastructure
      - L0Data
    L2aCoreDomain:
      - L1Infrastructure
      - L0Data
    L1Infrastructure:
      - L0Data
    L0Data: []
  # No skip_violations: 0 violations project-wide. Layer names here are
  # deliberately hyphen-free (`L0Data`, `L1Infrastructure`, ...) --
  # deptrac's Symfony Config layer parsing silently breaks ruleset
  # resolution when a layer name contains a hyphen (confirmed via an
  # isolated minimal reproduction: a bare `LayerA: [LayerB]` ruleset
  # entry resolves correctly, but renaming to `Layer-A: [Layer-B]` makes
  # the identical dependency register as a violation), so a hyphenated
  # layer name here would silently misreport real, explicitly-allowed
  # cross-layer dependencies as violations.
