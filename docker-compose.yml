services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: piwigo
      MARIADB_USER: piwigo
      MARIADB_PASSWORD: piwigo
    volumes: ["./docker/init:/docker-entrypoint-initdb.d"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["3307:3306"]

  web:
    image: piwigo16-web:ci
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes: ["./:/var/www/html"]
    ports: ["8090:80"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/install.php"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    command: >
      bash -c "mkdir -p /var/www/html/_data/templates_c
                        /var/www/html/_data/cache
                        /var/www/html/_data/combined
                        /var/www/html/_data/i
                        /var/www/html/_data/logs &&
               apache2-foreground"

  e2e:
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    depends_on: [web]
    working_dir: /work
    volumes: ["./:/work"]
    environment:
      BASE_URL: http://web
    command: ["sleep", "infinity"]
