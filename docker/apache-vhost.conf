# Apache vhost for the `production-apache` Dockerfile stage (fallback for
# hosts needing classic Apache/mod_rewrite -- see docs/REFERENCE.md's
# Deployment section, ADR-0013). Mirrors docker/Caddyfile's `root *
# /app/public` for the FrankenPHP stage, and the apache-deny-rules CI job's
# own vhost (.github/workflows/ci.yml): document root is public/, not
# /var/www/html itself, so config/tools/dev/src/tests/install/vendor/
# node_modules/docs/deploy/.git and the sensitive root-level tooling
# configs are structurally unreachable, not just deny-listed.
# public/.htaccess's own rules stay in effect as defense-in-depth on top of
# this, same as on the FrankenPHP image.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # FollowSymLinks: public/dist, public/themes, and
        # public/_data/combined are real symlinks out to the app
        # directory -- without this they 404 instead of resolving.
        # AllowOverride All: public/.htaccess's RewriteRule/Header
        # directives are no-ops without it.
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
