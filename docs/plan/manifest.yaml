# Structured plan data for docs/PLAN-REPLAY.md, kept in sync by hand and checked
# by tools/plan-lint.php. See docs/PLAN-REPLAY.md "Plan manifest and traceability".
#
# phases: the flat backbone P0-P32, one gated commit unit each (grouped into epochs A-I
#   for navigation only). depends_on lists the phases each phase's own header names as
#   its actual prerequisite (not always the immediately preceding phase number) - the
#   execution ORDER is still strictly linear P0->P32 regardless.
# tracks: T3, cuttable; attach after their dependency phase; never gate a backbone commit.
# adoption: non-cuttable, outside the parity sequence.
# sec: SEC-01..SEC-65 master checklist, cross-referenced with the threat model.
# tiers: T1 core-parity, T2 modernization, T3 cuttable stretch. A phase may span two
#   tiers (e.g. "T1-T2") when its scope mixes both.

