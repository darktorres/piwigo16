  - {id: SEC-14, phase: P9,  threat: "Session hijacking / fixation", verified_by: "CookieService::setCookieVar() was missing secure/httponly entirely (confirmed via direct read); fixed (f90d0fc84) to set both via the same ini_get()-based pattern the remember-me cookie already used (P18)", status: done}
