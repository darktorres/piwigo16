  # CsrfServiceTest's new "getToken uses sha256, not md5" regression test
  # (recomputes the expected HMAC directly, not just an output-length
  # check); live-verified via a real browser session performing a real
  # pwg_token-protected admin action (tag create/delete, TagCrudTest).
  - {id: SEC-11, phase: P9,  threat: "CSRF on state-changing actions", verified_by: "CsrfService::getToken() uses hash_hmac('sha256', ...) instead of md5; CsrfServiceTest regression test; live-verified via a real pwg_token-protected admin action", status: done}
  - {id: SEC-12, phase: P9,  threat: "CSRF on state-changing actions", verified_by: "CsrfService::check() uses hash_equals() instead of ===; CsrfServiceTest; live-verified via a real pwg_token-protected admin action", status: done}
