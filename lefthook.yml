pre-commit:
  commands:
    # ECS checks whole files, not just staged lines, and the legacy tree
    # carries pre-existing style debt that's a recorded count (see
    # docs/REFERENCE.md), not a hard gate, until P5's whole-codebase
    # reformat — so this reports but doesn't block a commit that only
    # touches a few lines of an otherwise-noncompliant legacy file.
    ecs:
      glob: "*.php"
      run: vendor/bin/ecs check {staged_files} || true
    eslint:
      glob: "*.{ts,js}"
      run: bunx eslint {staged_files}
    # Blocks, unlike ecs above: composer.json has no pre-existing layout debt,
    # and `composer lint:composer:fix` fixes any failure in one command.
    composer-normalize:
      glob: "composer.json"
      run: composer lint:composer
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
pre-push:
  commands:
    phpstan:
      # composer analyse:phpstan, not the bare phpstan binary -- the script
      # chains the phpstan-latte:compile pre-step (generates
      # _analysis/phpstan-latte/) ahead of the analysis; calling the binary
      # directly would silently skip template type-checking. phpstan
      # auto-disables progress output on non-TTY, no --no-progress needed.
      run: composer analyse:phpstan
