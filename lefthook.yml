pre-commit:
  commands:
    # ECS checks whole files, not just staged lines, and the legacy tree
    # carries pre-existing style debt that's a recorded count (see
    # docs/DEVELOPMENT.md), not a hard gate, until P5's whole-codebase
    # reformat — so this reports but doesn't block a commit that only
    # touches a few lines of an otherwise-noncompliant legacy file.
    ecs:
      glob: "*.php"
      run: vendor/bin/ecs check {staged_files} || true
    eslint:
      glob: "*.{ts,js}"
      run: bunx eslint {staged_files}
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
pre-push:
  commands:
    phpstan:
      run: vendor/bin/phpstan analyse --no-progress
    # --no-cache: Psalm's file-storage cache skips re-scanning unchanged
    # files, which silently stops re-reporting MissingClassConstType/
    # InvalidDocblock (scan-time-only issues) after the first run — see
    # ci.yml's psalm job comment for the exact source-level mechanism. A
    # developer's warm local cache could otherwise let broken code through
    # this gate.
    psalm:
      run: vendor/bin/psalm --no-progress --no-cache

