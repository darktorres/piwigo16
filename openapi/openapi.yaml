openapi: 3.2.0
info:
  title: Piwigo REST API
  version: '1.0'
  description: >-
    Piwigo's REST API, served under `/api/v1`. Every operation returns a
    JSON body on success; every error path returns an RFC 9457
    `application/problem+json` body ($ref'd throughout as `Problem`).

    Authentication is a session cookie, obtained by `POST
    /session/login` with either a real username/password or a
    previously-issued API key (`pkid-<date>-<id>:<secret>` submitted as
    `username`/`password`). There is no per-request `Authorization`
    header mechanism -- once logged in, the session cookie is sent on
    every subsequent request, browser-style.
  license:
    name: GPL-2.0-or-later
    identifier: GPL-2.0-or-later
servers:
  - url: /api/v1
    description: Same-origin Piwigo instance.
security:
  - sessionCookie: []
tags:
  - name: Comments
    description: Admin moderation of user-submitted image comments.
  - name: Extensions
    description: >-
      Plugin/theme/language install, activation, update, and
      update-check state -- most operations require webmaster status,
      not just admin.
  - name: Info/System
    description: >-
      Version, aggregate gallery stats, disk cache size, and the admin
      activity (audit) log.
  - name: Tags
    description: Tag CRUD, merge/duplicate, and tag-filtered image listing.
  - name: Groups
    description: User-group CRUD, merge/duplicate, and membership management.
  - name: Users
    description: User CRUD, password/auth-key admin actions, and rating cleanup.
  - name: Uploads
    description: >-
      Pre-upload readiness/duplicate checks, the tus 1.0.0 resumable
      upload protocol (`/uploads`, `/uploads/{id}`), and post-batch
      lounge completion.
  - name: Session
    description: >-
      Login/logout/status, the signed-in user's own account, and its
      real sub-resources -- API keys, favorites, the batch-manager
      caddie, and per-user preferences.
  - name: 'Session > API Keys'
    parent: Session
    description: A signed-in user's own API keys, for the auth-key login flow.
  - name: 'Session > Favorites'
    parent: Session
    description: A signed-in user's own favorited images.
  - name: 'Session > Caddie'
    parent: Session
    description: The admin batch-manager lightbox/caddie.
  - name: 'Session > Preferences'
    parent: Session
    description: Arbitrary per-session-user preference key/value storage.
  - name: History
    description: >-
      Visit/download logging (`POST /history/log`, fired on every
      gallery page view, anonymous visitors included) and the admin
      history-log search page's own filtered query.
paths:
