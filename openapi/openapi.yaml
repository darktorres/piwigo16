components:
  parameters:
    fMinRate:
      name: fMinRate
      in: query
      description: Shared images-table range filter (11 `f*` params total).
      schema:
        type: number
    fMaxRate:
      name: fMaxRate
      in: query
      schema:
        type: number
    fMinHit:
      name: fMinHit
      in: query
      schema:
        type: integer
    fMaxHit:
      name: fMaxHit
      in: query
      schema:
        type: integer
    fMinRatio:
      name: fMinRatio
      in: query
      schema:
        type: number
    fMaxRatio:
      name: fMaxRatio
      in: query
      schema:
        type: number
    fMaxLevel:
      name: fMaxLevel
      in: query
      schema:
        type: integer
    fMinDateAvailable:
      name: fMinDateAvailable
      in: query
      schema:
        type: string
        format: date
    fMaxDateAvailable:
      name: fMaxDateAvailable
      in: query
      schema:
        type: string
        format: date
    fMinDateCreated:
      name: fMinDateCreated
      in: query
      schema:
        type: string
        format: date
    fMaxDateCreated:
      name: fMaxDateCreated
      in: query
      schema:
        type: string
        format: date
  headers:
    TusResumable:
      description: Echoes the negotiated tus protocol version.
      schema:
        type: string
        example: 1.0.0
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pwg_id
      description: >-
        Set by a successful `POST /session/login`. The cookie name is
        deployment-configurable (the `session_name` config key);
        `pwg_id` is Piwigo's own default and is what a fresh install
        uses.
  schemas:
    Problem:
      type: object
      description: RFC 9457 `application/problem+json` error body.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code, repeated here for convenience.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
  responses:
    BadRequest:
      description: The request body is not valid JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Well-formed request, semantically invalid input.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No signed-in session (or an invalid/expired one).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        Signed in, but lacking the required admin privilege, or (on a
        mutating request) a missing/invalid `X-CSRF-Token` header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No resource matches the given id(s).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: >-
        A deliberate, application-level failure with a defined
        problem+json shape -- distinct from the generic middleware
        catch-all, which returns plain text instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
