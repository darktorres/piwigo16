  /extensions/updates/ignore:
    $ref: 'paths/extensions.yaml#/~1extensions~1updates~1ignore'
  '/extensions/{type}/{id}/actions/update':
    $ref: 'paths/extensions.yaml#/~1extensions~1{type}~1{id}~1actions~1update'
  /version:
