  '/groups/{id}/actions/remove-user':
    $ref: 'paths/groups.yaml#/~1groups~1{id}~1actions~1remove-user'
  /groups/actions/merge:
    $ref: 'paths/groups.yaml#/~1groups~1actions~1merge'
  /users:
